    <script>
      document.addEventListener('DOMContentLoaded',function(){
        var ticks=0;
        var watcher=new MutationObserver(sync);
        function sync(){
          var service=document.querySelector('#services');
          if(service&&!document.getElementById('jnb-website-services-card')){
            var cards=Array.from(service.querySelectorAll('a[href*="/services/"]')).filter(function(a){return a.getAttribute('href')!='/services/website-design/'});
            var first=cards.length?cards[0]:null;var card=first?(first.closest('article, .service-card, .service-tile, .card')||first.parentElement):null;var target=card?card.parentElement:null;
            if(target){
              var link=document.createElement('a');
              link.id='jnb-website-services-card';
              link.className='jnb-web-service-link';
              link.href='/services/website-design/';
              link.innerHTML='<strong>Website Design &amp; Development</strong><span>Custom websites built to turn visitors into leads. Design, development, mobile experience, SEO foundations &amp; analytics. Projects $2,500–$5,000. &rarr;</span>';
              if(target.parentElement)target.parentElement.appendChild(link);
            }
          }
          var foot=document.querySelector('footer');
          if(foot&&!document.getElementById('jnb-website-footer-link')){
            var serviceLinks=Array.from(foot.querySelectorAll('a[href*="/services/"]'));
            var link=document.createElement('a');link.id='jnb-website-footer-link';link.className='jnb-web-footer-link';link.href='/services/website-design/';link.textContent='Website Design & Development';
            if(serviceLinks.length){
              var last=serviceLinks[serviceLinks.length-1];
              if(last.parentElement && last.parentElement.tagName==='LI'){var li=document.createElement('li');li.appendChild(link);last.parentElement.parentElement.appendChild(li)}
              else{last.parentElement.appendChild(link)}
            }else{var list=foot.querySelector('ul');if(list){var li=document.createElement('li');li.appendChild(link);list.appendChild(li)}else{foot.appendChild(link)}}
          }
          ticks++;
          if(document.getElementById('jnb-website-services-card')&&document.getElementById('jnb-website-footer-link'))watcher.disconnect();
          if(ticks>500)watcher.disconnect();
        }
        watcher.observe(document.body,{childList:true,subtree:true});
        sync();
      });
    </script>
