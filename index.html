    <script>
      (function(){
        function getSection(){
          var headings=Array.from(document.querySelectorAll('#root h1,#root h2,#root h3,#root h4'));
          var h=headings.find(function(el){return /^our services$|^services$|^what we do$|^how we help$/i.test((el.textContent||'').trim())});
          return h?(h.closest('section')||h.parentElement.parentElement):document.querySelector('#services');
        }
        function newCard(){
          var a=document.createElement('a');
          a.id='jnb-website-services-card';
          a.className='jnb-web-service-link';
          a.href='/services/website-design/';
          a.innerHTML='<strong>Website Design &amp; Development</strong><span>Custom, mobile-friendly small-business websites designed to generate leads. Design, development, SEO foundations and analytics. Projects $2,500–$5,000. &rarr;</span>';
          return a;
        }
        function apply(){
          var section=getSection(),card=document.getElementById('jnb-website-services-card');
          if(section&&!card){
            var candidates=Array.from(section.querySelectorAll('a,article,div')).filter(function(e){return e.children.length>0&&/bookkeeping|quickbooks|marketing/i.test(e.textContent||'')});
            var matched=candidates.sort(function(a,b){return a.textContent.length-b.textContent.length})[0];
            var list=matched&&matched.closest('.grid,.services-grid,[class*="grid"],[class*="Grid"]');
            if(!list){
              var grids=Array.from(section.querySelectorAll('[class*="grid"],[class*="Grid"]'));
              list=grids.find(function(e){return e.children.length>=2})||null;
            }
            (list||section).appendChild(newCard());
          }
          var footer=document.querySelector('#root footer,footer');
          if(footer&&!document.getElementById('jnb-website-footer-link')){
            var link=document.createElement('a');
            link.id='jnb-website-footer-link';link.className='jnb-web-footer-link';
            link.href='/services/website-design/';link.textContent='Website Design & Development';
            var anchors=Array.from(footer.querySelectorAll('a'));
            var serviceAnchor=anchors.find(function(a){return /marketing|bookkeeping|quickbooks/i.test(a.textContent||'')});
            if(serviceAnchor&&serviceAnchor.closest('li')){
              var li=document.createElement('li');li.appendChild(link);serviceAnchor.closest('li').parentElement.appendChild(li);
            }else{
              var group=serviceAnchor?serviceAnchor.parentElement:footer;
              var holder=document.createElement('div');holder.style.padding='12px 0';holder.appendChild(link);group.appendChild(holder);
            }
          }
        }
        document.addEventListener('DOMContentLoaded',function(){
          var root=document.getElementById('root');
          if(!root)return;
          var observer=new MutationObserver(function(){observer.disconnect();apply();observer.observe(root,{childList:true,subtree:true})});
          observer.observe(root,{childList:true,subtree:true});
          apply();
          window.addEventListener('load',apply);
        });
      })();
    </script>
