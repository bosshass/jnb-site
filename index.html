    <script>
      (function(){
        var target='/services/website-design/';
        function looksLikeServices(node){
          return /^(our services|services|what we do|how we help|services designed for you)$/i.test((node.textContent||'').trim());
        }
        function apply(){
          var root=document.getElementById('root'),footer=root&&root.querySelector('footer');
          if(!root)return;
          if(footer){
            var misplaced=footer.querySelector('#jnb-website-services-card');
            if(misplaced)misplaced.remove();
            if(!footer.querySelector('#jnb-website-footer-link')){
              var base=Array.from(footer.querySelectorAll('a')).find(function(a){return /^financial systems$/i.test(a.textContent.trim())});
              if(base){
                var link=document.createElement('a');
                link.id='jnb-website-footer-link';link.href=target;
                link.className=base.className;link.textContent='Website Design & Development';
                if(base.parentElement.tagName==='LI'){
                  var li=base.parentElement.cloneNode(false);li.appendChild(link);base.parentElement.after(li);
                }else base.after(link);
              }
            }
            Array.from(footer.querySelectorAll('a')).forEach(function(a){if(a.textContent.trim()==='Lifeline')a.textContent='Javelin'});
          }
          // Find the same card grid as the homepage's other service offerings.
          if(!root.querySelector('#jnb-website-services-card')){
            var heading=Array.from(root.querySelectorAll('main h1,main h2,main h3,section h2,section h3')).find(looksLikeServices);
            var area=heading&&heading.closest('section');
            if(!area){
              var serviceLink=Array.from(root.querySelectorAll('main a[href*="/services/"]')).find(function(a){
                return /bookkeeping|fractional cfo|financial systems/i.test(a.textContent||'');
              });
              area=serviceLink&&serviceLink.closest('section');
            }
            if(area&&(!footer||!footer.contains(area))){
              var candidates=Array.from(area.querySelectorAll('a[href*="/services/"]')).filter(function(a){
                return a.closest('footer')===null&&a.href.indexOf('website-design')===-1;
              });
              var peer=candidates.find(function(a){
                return a.querySelector('h2,h3,h4')&&a.parentElement&&a.parentElement.children.length>1;
              })||candidates.find(function(a){return a.parentElement&&a.parentElement.children.length>1});
              if(peer){
                var card=peer.cloneNode(true);
                card.id='jnb-website-services-card';card.href=target;
                card.querySelectorAll('[id]').forEach(function(el){el.removeAttribute('id')});
                var title=card.querySelector('h2,h3,h4');
                if(title)title.textContent='Website Design & Development';
                else card.textContent='Website Design & Development';
                var paragraphs=card.querySelectorAll('p');
                if(paragraphs.length)paragraphs[0].textContent='Custom, mobile-friendly websites built to generate leads, with SEO foundations and analytics.';
                card.querySelectorAll('a').forEach(function(a){a.href=target});
                peer.parentElement.appendChild(card);
              }
            }
          }
          // Add the missing link to the existing Services navigation dropdown.
          var navs=Array.from(root.querySelectorAll('header,nav'));
          navs.forEach(function(nav){
            if(nav.querySelector('#jnb-website-nav-link'))return;
            var anchors=Array.from(nav.querySelectorAll('a[href*="/services/"]')).filter(function(a){
              return a.getAttribute('href')!==target;
            });
            var dropdownLinks=anchors.filter(function(a){
              return /bookkeeping|fractional cfo|financial systems|tax preparation|quickbooks/i.test(a.textContent||'');
            });
            var base=dropdownLinks.find(function(a){
              return a.parentElement&&a.parentElement.querySelectorAll('a[href*="/services/"]').length>=2;
            })||dropdownLinks[0];
            if(!base)return;
            var link=base.cloneNode(true);
            link.id='jnb-website-nav-link';link.href=target;
            link.textContent='Website Design & Development';
            if(base.parentElement.tagName==='LI'){
              var li=base.parentElement.cloneNode(false);li.appendChild(link);base.parentElement.appendChild(li);
            }else{
              var last=dropdownLinks.filter(function(a){return a.parentElement===base.parentElement}).pop()||base;
              last.after(link);
            }
          });
        }
        document.addEventListener('DOMContentLoaded',function(){
          var root=document.getElementById('root');if(!root)return;
          var busy=false;
          var observer=new MutationObserver(function(){
            if(busy)return;
            busy=true;
            requestAnimationFrame(function(){busy=false;apply()});
          });
          observer.observe(root,{childList:true,subtree:true});
          apply();window.addEventListener('load',apply);
        });
      })();
    </script>
