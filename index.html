    <script>
      (function(){
        function apply(){
          var root=document.getElementById('root');
          if(!root)return;
          var footer=root.querySelector('footer');
          if(!footer)return;
          // Remove the previously injected card if it ended up inside the footer.
          var card=document.getElementById('jnb-website-services-card');
          if(card&&footer.contains(card))card.remove();
          // Keep the website service as an ordinary link within the Services column.
          if(!footer.querySelector('#jnb-website-footer-link')){
            var links=Array.from(footer.querySelectorAll('a'));
            var preceding=links.find(function(a){return /^financial systems$/i.test((a.textContent||'').trim())})
              ||links.find(function(a){return /^fractional cfo$|^bookkeeping$/i.test((a.textContent||'').trim())});
            if(preceding){
              var link=document.createElement('a');
              link.id='jnb-website-footer-link';
              link.href='/services/website-design/';
              link.textContent='Website Design & Development';
              link.className=preceding.className;
              var parent=preceding.parentElement;
              if(parent&&parent.tagName==='LI'){
                var item=parent.cloneNode(false);
                item.appendChild(link);
                parent.after(item);
              }else{
                // Matching sibling link inherits the existing footer's layout and typography.
                preceding.after(link);
              }
            }
          }
          // Only add a service card within a real Services section, never the footer.
          if(!document.getElementById('jnb-website-services-card')){
            var headings=Array.from(root.querySelectorAll('main h1,main h2,main h3,section h2,section h3'));
            var heading=headings.find(function(el){return /^(our services|services|what we do|how we help)$/i.test((el.textContent||'').trim())});
            var section=heading&&heading.closest('section');
            if(section&&!section.contains(footer)&&!footer.contains(section)){
              var cards=Array.from(section.querySelectorAll('a[href]')).filter(function(a){
                return /bookkeeping|quickbooks|financial systems|fractional cfo/i.test(a.textContent||'');
              });
              var peer=cards.find(function(a){return a.parentElement&&a.parentElement.children.length>1});
              if(peer){
                var item=peer.cloneNode(false);
                item.id='jnb-website-services-card';
                item.href='/services/website-design/';
                item.textContent='Website Design & Development';
                item.className=peer.className;
                peer.parentElement.appendChild(item);
              }
            }
          }
          // Product branding in the footer.
          Array.from(footer.querySelectorAll('a')).forEach(function(a){
            if((a.textContent||'').trim()==='Lifeline')a.textContent='Javelin';
          });
        }
        document.addEventListener('DOMContentLoaded',function(){
          var root=document.getElementById('root');
          if(!root)return;
          var scheduled=false;
          var observer=new MutationObserver(function(){
            if(scheduled)return;
            scheduled=true;
            requestAnimationFrame(function(){scheduled=false;apply()});
          });
          observer.observe(root,{childList:true,subtree:true});
          apply();
          window.addEventListener('load',apply);
        });
      })();
    </script>
